<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centered Table</title>
<style>
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    }
    table {
    width: 400px;
    height: 200px;
    border-collapse: collapse;
    }
    td {
    border: 1px solid #000000;
    background-color: #ffffff;
    text-align: center;
    width: 50px; /* Adjusted for equal division of the table's width */
    height: 15px; /* Adjusted based on total height and number of rows */
    }
    th {
    background: #ffffff;
    border: 1px solid #000000;
    text-align: center;
    width: 50px; /* Adjusted for equal division of the table's width */
    height: 20px; /* Slightly taller header row */
    }
</style>
